<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="Surf the Bitcoin network as a non-standard transaction. Dodge policy filters, ride giant packets, and find the Slipstream tunnel." />
<link rel="icon" href="./favicon.svg" />
<link rel="preload" href="./assets/brand/roboto-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
<title>Slipstream Surfers</title>
<!--BOOT-MANIFEST-->
<style>
@font-face{font-family:"Roboto Mono";src:url('/assets/brand/roboto-mono-latin-400.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
:root{--ink:#050505;--gold:#f7931a;--red:#ff5673;--panel:rgba(27,27,27,.94);--line:rgba(255,255,255,.2);--muted:#b0b0b0;--mono:"Roboto Mono",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#f7f7f7;font-family:var(--mono);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
button,a{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:4px}
#game{position:fixed;inset:0;display:block;width:100vw;height:100vh}#ui{position:fixed;inset:0;touch-action:none}
/* The official white lockup, charcoal panels and monospace labels echo the submission portal. */
.brand-logo{display:block;width:100%;height:auto}.brand-title{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px}.brand-title .brand-logo{width:100%;max-width:335px}.brand-title span{font-size:17px;font-weight:400;letter-spacing:.5em;line-height:1;padding-left:3px}
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#050505;transition:opacity .35s}#loader.out{opacity:0;pointer-events:none}#loader .brand-title{width:min(320px,74vw);align-items:center}.bar{width:min(320px,74vw);height:2px;background:#363636;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .15s linear}#ld-text{font-size:11px;color:var(--muted);min-height:1.2em}
.hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}.hud.on{opacity:1}.network-label{position:absolute;left:24px;top:22px;display:flex;flex-direction:column;gap:10px;width:190px;filter:drop-shadow(0 2px 5px #000)}.network-label span{font-size:9px;letter-spacing:.25em;color:#ddd}.hud-left{position:absolute;left:24px;top:102px;display:flex;gap:8px;pointer-events:auto}.icon-btn{width:36px;height:36px;border-radius:2px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}.icon-btn svg{width:18px;height:18px;fill:currentColor}.hud-right{position:absolute;right:24px;top:20px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;text-align:right}.score{font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 2px 5px #000}.hud-row{display:flex;gap:8px;align-items:center}.mult,.coins{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:5px 9px;font-size:13px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}.mult.hot{background:#893c00}.coins.pop{animation:pop .22s ease-out}.coin-ico{display:inline-block;width:18px;height:18px;background:url('/assets/bitcoin.svg') center/contain no-repeat}.powers{display:flex;flex-direction:column;gap:6px;align-items:flex-end}.pw{position:relative;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:5px 9px 8px;font-size:10px;overflow:hidden;min-width:120px}.pw i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;font-size:12px}.pw em{position:absolute;left:0;bottom:0;height:2px;width:100%;background:currentColor;transform-origin:left}.pw.magnet{color:#ff8ca4}.pw.shoes{color:#70d2ff}.pw.double,.pw.helmet{color:#ffc366}.pw.slipstream{color:#d4fff3}.pw.cpfp{color:#c4a0ff}
.hint{position:absolute;left:50%;top:22%;transform:translate(-50%,10px);max-width:90%;background:var(--panel);border:1px solid #fff6;padding:12px 18px;border-radius:2px;font-size:13px;text-align:center;opacity:0;transition:opacity .2s,transform .2s}.hint.on{opacity:1;transform:translate(-50%,0)}.toast{position:absolute;left:50%;top:32%;width:90%;transform:translateX(-50%) scale(.9);font-size:20px;text-shadow:0 2px 8px #000;text-align:center;opacity:0;transition:opacity .18s,transform .18s}.toast.on{opacity:1;transform:translateX(-50%) scale(1)}.flash{position:absolute;inset:0;pointer-events:none;opacity:0}.flash.hit{background:radial-gradient(ellipse at center,transparent 45%,#ff3c3c88);animation:fl .45s ease-out}.flash.crash{background:radial-gradient(ellipse at center,#fff6,#ff2828a6);animation:fl .7s ease-out}.flash.power{background:radial-gradient(ellipse at center,#ffffff59,transparent 70%);animation:fl .35s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}@keyframes pop{50%{transform:scale(1.18)}}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px}.screen.on{display:flex}.screen.start{padding:58px 6vw 90px;align-items:center;justify-content:flex-end}.portal-banner{position:absolute;top:0;left:0;right:0;background:#f7f7f7;color:#101010;text-align:center;padding:7px 16px;font-size:11px;letter-spacing:.025em}.screen.pause,.screen.over{background:#0008;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.panel{width:min(430px,100%);background:var(--panel);border:1px solid #ffffff40;border-radius:3px;padding:28px;display:flex;flex-direction:column;gap:17px;box-shadow:0 18px 70px #0008;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.screen.start .panel{width:min(430px,44vw)}.panel h2{margin:0;font-size:24px;font-weight:400;line-height:1.35}.eyebrow{font-size:9px;letter-spacing:.12em;color:var(--muted)}.tag{margin:1px 0 0;font-size:12px;color:#eee;line-height:1.6}.mission{font-size:12px;line-height:1.8;color:var(--muted)}.stats,.result{display:grid;grid-template-columns:1fr 1fr;gap:1px;border:1px solid var(--line)}.stats div,.result div{background:#ffffff05;padding:10px 13px}.stats small,.result small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.stats b,.result b{font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}.big{border:1px solid #fff;border-radius:2px;padding:16px 18px;font-size:14px;font-weight:400;background:#f7f7f7;color:#111;text-align:left;letter-spacing:.035em}.big:hover{background:#d9d9d9}.big:active{transform:translateY(1px)}.ghost{border:1px solid #ffffff35;border-radius:2px;padding:11px;font-size:11px;background:#ffffff05}.ghost:hover,.chip:hover,.icon-btn:hover{background:#ffffff17}.demo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ctrl{margin:0;font-size:10px;color:#b5b5b5;line-height:1.8}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:2px;padding:8px;font-size:9px;text-decoration:none}.chip svg{width:15px;height:15px;fill:currentColor}.chip[hidden]{display:none}.badge{display:none;align-self:flex-start;background:var(--gold);color:#111;padding:5px 10px;font-size:11px;animation:pop .5s ease-out 2}.badge.on{display:block}.catch-line{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
.route-status{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.06em;padding:12px 16px;border:1px solid var(--line);background:var(--panel);border-radius:2px;white-space:nowrap;color:#ccc}.route-status i{display:inline-block;background:#ff5673;width:5px;height:5px;border-radius:50%;margin:0 8px;box-shadow:0 0 8px #ff5673}.route-status i.private{background:#b1ffe5;box-shadow:0 0 8px #b1ffe5}.route-status b{margin-left:16px;color:#fff;font-weight:400}.field-guide{position:absolute;left:6vw;right:6vw;bottom:24px;display:flex;gap:36px;pointer-events:none}.field-guide div{border-top:1px solid #ffffff35;padding-top:10px;display:flex;flex-direction:column;gap:5px;flex:1}.field-guide b{font-size:9px;font-weight:400;letter-spacing:.05em;color:#eee}.field-guide span{font-size:10px;color:#aaa}.replay{position:absolute;bottom:84px;left:24px;color:#fff;background:var(--panel);border:1px solid #fff6;font-size:10px;text-decoration:none;padding:12px;border-radius:2px;pointer-events:auto}
@media(max-aspect-ratio:5/4){.screen.start{padding:50px 18px 24px;align-items:flex-end;justify-content:center}.screen.start .panel{padding:20px;gap:12px;width:min(420px,100%)}.brand-title .brand-logo{max-width:300px}.brand-title{gap:10px}.brand-title span{font-size:14px}.field-guide,.stats{display:none}.network-label{left:15px;top:16px;width:150px;gap:8px}.network-label span{font-size:8px}.hud-left{left:15px;top:86px}.hud-right{right:15px;top:14px}.score{font-size:25px}.route-status{font-size:7px;padding:10px;bottom:18px}.route-status b{margin-left:6px}.route-status i{margin:0 4px}.pw{font-size:9px;min-width:100px}.replay{bottom:65px;left:15px}.mission{font-size:11px}.tag{font-size:11px}}
@media(max-width:360px){.network-label{width:130px}.network-label span{letter-spacing:.15em}.panel{padding:16px!important}.row{gap:5px}.chip{padding:7px;font-size:8px}.route-status{font-size:6px}.score{font-size:23px}}
@media(max-height:650px){.screen.start .panel{gap:10px;padding:20px}.stats,.mission,.field-guide{display:none}.screen.start{padding-top:45px;padding-bottom:20px}.brand-title .brand-logo{max-width:270px}.brand-title span{font-size:13px}.big{padding:12px}.panel{max-height:calc(100dvh - 70px);overflow:auto}.route-status{bottom:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Slipstream Surfers 3D network runner"></canvas>
<div id="ui"></div>
<div id="loader">
  <h1 id="ld-title" class="brand-title"><img class="brand-logo" src="./assets/brand/slipstream-logo.svg" alt="MARA Slipstream" width="455" height="109" /><span>SURFERS</span></h1>
  <div class="bar"><i id="ld-bar"></i></div>
  <div id="ld-text">0%</div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
