<title>Slipstream Surfers</title>
<!--BOOT-MANIFEST-->
<style>
@font-face{font-family:"Roboto Mono";src:url('/assets/brand/roboto-mono-latin-400.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
:root{--ink:#050505;--gold:#f7931a;--red:#ff5673;--panel:rgba(27,27,27,.94);--line:rgba(255,255,255,.2);--muted:#b0b0b0;--mono:"Roboto Mono",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.brand-logo{display:block;width:100%;height:auto}.brand-title{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px}.brand-title .brand-logo{width:100%;max-width:335px}.brand-title span{font-size:17px;font-weight:400;letter-spacing:.5em;line-height:1;padding-left:3px}
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#050505;transition:opacity .35s}#loader.out{opacity:0;pointer-events:none}#loader .brand-title{width:min(320px,74vw);align-items:center}.bar{width:min(320px,74vw);height:2px;background:#363636;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .15s linear}#ld-text{font-size:11px;color:var(--muted);min-height:1.2em}
.hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}.hud.on{opacity:1}.network-label{position:absolute;left:24px;top:22px;display:flex;flex-direction:column;gap:10px;width:190px;filter:drop-shadow(0 2px 5px #000)}.network-label span{font-size:9px;letter-spacing:.25em;color:#ddd}.hud-left{position:absolute;left:24px;top:102px;display:flex;gap:8px;pointer-events:auto}.icon-btn{width:36px;height:36px;border-radius:2px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}.icon-btn svg{width:18px;height:18px;fill:currentColor}.hud-right{position:absolute;right:24px;top:20px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;text-align:right}.score{font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 2px 5px #000}.hud-row{display:flex;gap:8px;align-items:center}.mult,.coins{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:5px 9px;font-size:13px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}.mult.hot{background:#893c00}.coins.pop{animation:pop .22s ease-out}.coin-ico{display:inline-block;width:18px;height:18px;background:url('/assets/bitcoin.svg') center/contain no-repeat}.powers{display:flex;flex-direction:column;gap:6px;align-items:flex-end}.pw{position:relative;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:5px 9px 8px;font-size:10px;overflow:hidden;min-width:120px}.pw i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;font-size:12px}.pw em{position:absolute;left:0;bottom:0;height:2px;width:100%;background:currentColor;transform-origin:left}.pw.magnet{color:#ff8ca4}.pw.shoes{color:#70d2ff}.pw.double,.pw.helmet{color:#ffc366}.pw.slipstream{color:#d4fff3}.pw.cpfp{color:#c4a0ff}
.hint{position:absolute;left:50%;top:22%;transform:translate(-50%,10px);max-width:90%;background:var(--panel);border:1px solid #fff6;padding:12px 18px;border-radius:2px;font-size:13px;text-align:center;opacity:0;transition:opacity .2s,transform .2s}.hint.on{opacity:1;transform:translate(-50%,0)}.toast{position:absolute;left:50%;top:32%;width:90%;transform:translateX(-50%) scale(.9);font-size:20px;text-shadow:0 2px 8px #000;text-align:center;opacity:0;transition:opacity .18s,transform .18s}.toast.on{opacity:1;transform:translateX(-50%) scale(1)}.flash{position:absolute;inset:0;pointer-events:none;opacity:0}.flash.hit{background:radial-gradient(ellipse at center,transparent 45%,#ff3c3c88);animation:fl .45s ease-out}.flash.crash{background:radial-gradient(ellipse at center,#fff6,#ff2828a6);animation:fl .7s ease-out}.flash.power{background:radial-gradient(ellipse at center,#ffffff59,transparent 70%);animation:fl .35s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}@keyframes pop{50%{transform:scale(1.18)}}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px}.screen.on{display:flex}.screen.start{padding:58px 6vw 90px;align-items:center;justify-content:flex-end}.screen.pause,.screen.over{background:#0008;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.panel{width:min(430px,100%);background:var(--panel);border:1px solid #ffffff40;border-radius:3px;padding:28px;display:flex;flex-direction:column;gap:17px;box-shadow:0 18px 70px #0008;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.screen.start .panel{width:min(430px,44vw)}.panel h2{margin:0;font-size:24px;font-weight:400;line-height:1.35}.eyebrow{font-size:9px;letter-spacing:.12em;color:var(--muted)}.tag{margin:1px 0 0;font-size:12px;color:#eee;line-height:1.6}.mission{font-size:12px;line-height:1.8;color:var(--muted)}.stats,.result{display:grid;grid-template-columns:1fr 1fr;gap:1px;border:1px solid var(--line)}.stats div,.result div{background:#ffffff05;padding:10px 13px}.stats small,.result small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.stats b,.result b{font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}.big{border:1px solid #fff;border-radius:2px;padding:16px 18px;font-size:14px;font-weight:400;background:#f7f7f7;color:#111;text-align:left;letter-spacing:.035em}.big:hover{background:#d9d9d9}.big:active{transform:translateY(1px)}.ghost{border:1px solid #ffffff35;border-radius:2px;padding:11px;font-size:11px;background:#ffffff05}.ghost:hover,.chip:hover,.icon-btn:hover{background:#ffffff17}.ctrl{margin:0;font-size:10px;color:#b5b5b5;line-height:1.8}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:2px;padding:8px;font-size:9px;text-decoration:none}.chip svg{width:15px;height:15px;fill:currentColor}.chip[hidden]{display:none}.badge{display:none;align-self:flex-start;background:var(--gold);color:#111;padding:5px 10px;font-size:11px;animation:pop .5s ease-out 2}.badge.on{display:block}.catch-line{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
.route-status{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.06em;padding:12px 16px;border:1px solid var(--line);background:var(--panel);border-radius:2px;white-space:nowrap;color:#ccc}.route-status i{display:inline-block;background:#ff5673;width:5px;height:5px;border-radius:50%;margin:0 8px;box-shadow:0 0 8px #ff5673}.route-status i.private{background:#b1ffe5;box-shadow:0 0 8px #b1ffe5}.route-status b{margin-left:16px;color:#fff;font-weight:400}.field-guide{position:absolute;left:6vw;right:6vw;bottom:24px;display:flex;gap:36px;pointer-events:none}.field-guide div{border-top:1px solid #ffffff35;padding-top:10px;display:flex;flex-direction:column;gap:5px;flex:1}.field-guide b{font-size:9px;font-weight:400;letter-spacing:.05em;color:#eee}.field-guide span{font-size:10px;color:#aaa}
/* Character cards use portraits rendered from the playable models. */
.screen.start .panel{padding:20px;gap:12px}.screen.start .brand-title{gap:9px}.screen.start .brand-title .brand-logo{max-width:230px}.screen.start .brand-title span{font-size:13px}.screen.start .tag,.screen.start .mission,.screen.start .stats{display:none}.screen.start .big{padding:14px 16px;font-size:13px}.screen.start .ghost{padding:10px;font-size:10px}.screen.start .ctrl{font-size:9px;line-height:1.65}
.character-picker{display:flex;flex-direction:column;gap:7px;min-width:0}.character-heading{display:flex;align-items:center;justify-content:space-between;color:#ddd;font-size:9px;line-height:12px;letter-spacing:.08em}.character-heading>span:last-child{color:#777;font-size:8px}.character-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.character-choice{min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 2px 8px;border:1px solid #ffffff26;border-radius:3px;background:#0c0c0c;color:#c7c7c7;transition:border-color .15s,background .15s,transform .15s}.character-choice:hover{border-color:#ffffff7a;background:#222}.character-choice.selected{border-color:var(--character-color);background:#242424;color:#fff;box-shadow:inset 0 -2px 0 var(--character-color)}.character-choice:active{transform:translateY(1px)}.character-choice:focus-visible{outline-offset:2px}.character-portrait{position:relative;display:grid;place-items:center;width:100%;height:72px;overflow:hidden;background:radial-gradient(ellipse at 50% 80%,#ffffff14,transparent 70%)}.character-portrait img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}.character-portrait img[hidden]{display:none}.portrait-placeholder{font-size:21px;color:var(--character-color);font-weight:700;opacity:.65}.has-portrait .portrait-placeholder{display:none}.character-check{display:none;position:absolute;right:3px;top:4px;width:13px;height:13px;place-items:center;background:var(--character-color);color:#111;font-size:9px;border-radius:50%}.selected .character-check{display:grid}.character-name{display:block;max-width:100%;font-size:8px;line-height:12px;white-space:normal;letter-spacing:-.02em}.character-detail{min-height:29px;margin:0;display:flex;flex-direction:column;gap:3px;line-height:13px}.character-detail b{color:var(--selected-color,#f7931a);font-size:10px;font-weight:400}.character-detail span{font-size:9px;color:#a9a9a9;line-height:13px}
@media(max-aspect-ratio:5/4){.screen.start{padding:50px 18px 24px;align-items:flex-end;justify-content:center}.screen.start .panel{padding:20px;gap:12px;width:min(420px,100%)}.brand-title .brand-logo{max-width:300px}.brand-title{gap:10px}.brand-title span{font-size:14px}.field-guide,.stats{display:none}.network-label{left:15px;top:16px;width:150px;gap:8px}.network-label span{font-size:8px}.hud-left{left:15px;top:86px}.hud-right{right:15px;top:14px}.score{font-size:25px}.route-status{font-size:7px;padding:10px;bottom:18px}.route-status b{margin-left:6px}.route-status i{margin:0 4px}.pw{font-size:9px;min-width:100px}.mission{font-size:11px}.tag{font-size:11px}}
@media(max-width:360px){.network-label{width:130px}.network-label span{letter-spacing:.15em}.panel{padding:16px!important}.row{gap:5px}.chip{padding:7px;font-size:8px}.route-status{font-size:6px}.score{font-size:23px}}
@media(max-height:650px){.screen.start .panel{gap:10px;padding:20px}.stats,.mission,.field-guide{display:none}.screen.start{padding-top:45px;padding-bottom:20px}.brand-title .brand-logo{max-width:270px}.brand-title span{font-size:13px}.big{padding:12px}.panel{max-height:calc(100dvh - 70px);overflow:auto}.route-status{bottom:12px}}
@media(max-aspect-ratio:5/4){.screen.start .panel{gap:10px;padding:18px}.screen.start .brand-title .brand-logo{max-width:210px}.screen.start .brand-title{gap:7px}.screen.start .brand-title span{font-size:11px}.character-portrait{height:64px}.character-options{gap:6px}.character-name{font-size:7px}.character-heading{font-size:8px}.character-detail{min-height:27px}.screen.start .ctrl{font-size:8px}.screen.start .row{gap:6px}.screen.start .chip{padding:7px;font-size:8px}}
@media(max-height:700px){.screen.start{padding-top:40px;padding-bottom:20px}.screen.start .panel{gap:9px;padding:16px;max-height:calc(100dvh - 60px);overflow:auto;touch-action:pan-y}.screen.start .field-guide{display:none}.screen.start .brand-title .brand-logo{max-width:185px}.screen.start .brand-title span{font-size:10px}.character-portrait{height:58px}.screen.start .big{padding:11px 14px}.screen.start .ctrl{font-size:8px}.screen.start .chip{padding:6px;font-size:8px}}
@media(orientation:landscape) and (max-height:520px){.screen.start{padding-top:36px;padding-bottom:10px}.screen.start .panel{width:min(520px,60vw);padding:12px;gap:7px;max-height:calc(100dvh - 46px)}.screen.start .brand-title{flex-direction:row;align-items:flex-end;gap:15px}.screen.start .brand-title .brand-logo{max-width:150px}.screen.start .brand-title span{font-size:10px;padding-bottom:5px}.character-heading{font-size:8px}.character-portrait{height:50px}.character-choice{padding-bottom:5px}.character-name{font-size:8px}.character-detail{flex-direction:row;align-items:center;gap:8px;min-height:14px}.character-detail b,.character-detail span{font-size:8px;line-height:12px}.screen.start .big{padding:10px 12px;font-size:11px}.screen.start .ghost{padding:7px}.screen.start .ctrl{display:none}.screen.start .row{gap:6px}.screen.start .chip{padding:5px;font-size:8px}}
#ui[data-screen="pause"],#ui[data-screen="over"]{touch-action:pan-y}
.screen .panel{max-height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#666 transparent}
.mission-sheet{border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;color:#e9e9e9}
.mission-sheet summary{cursor:pointer;padding:10px 2px;line-height:1.4}
.mission-sheet summary:focus-visible{outline:2px solid #fff;outline-offset:1px}
#mission-mult{float:right;color:#ffb665;font-variant-numeric:tabular-nums}
#mission-goals{list-style:none;margin:0;padding:2px 2px 0}
#mission-goals li{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin:0 0 9px}
#mission-goals li span:last-of-type{color:var(--muted);font-variant-numeric:tabular-nums}
#mission-goals li.complete span{color:#b1ffe5}
#mission-goals progress{appearance:none;grid-column:1/-1;width:100%;height:3px;border:0;background:#444;color:var(--gold)}
#mission-goals progress::-webkit-progress-bar{background:#444}
#mission-goals progress::-webkit-progress-value{background:var(--gold)}
#mission-goals progress::-moz-progress-bar{background:var(--gold)}
.mission-reward{margin:4px 2px 9px;font-size:10px;color:#f4c18b}
.track-guide{border-top:1px solid var(--line);color:var(--muted);font-size:10px}
.track-guide dl{margin:0 2px 12px;line-height:1.6}
.track-guide dt{color:#e8e8e8}.track-guide dd{margin:0 0 7px}
.delivery-receipt{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);padding:8px 12px;white-space:nowrap;background:#10251ff0;border:1px solid #91d5b6;color:#c7ffe3;font-size:11px;opacity:0;transition:opacity .18s}
.delivery-receipt.on{opacity:1}
@media(max-aspect-ratio:5/4){.delivery-receipt{bottom:55px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
