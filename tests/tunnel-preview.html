<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>Slipstream tunnel — local visual check</title>
</head>
<body>
  <canvas id="game" aria-label="Slipstream tunnel visual check"></canvas>
  <div id="ui"></div>
  <small id="synthetic-label" hidden>Synthetic block preview</small>
  <aside id="qa-tools" aria-label="Local tunnel visual checks">
    <strong>Local visual check</strong>
    <div class="qa-actions">
      <button type="button" id="full">Full tunnel</button>
      <button type="button" id="warning">3 seconds to exit</button>
      <button type="button" id="shield">Exit shield</button>
      <button type="button" id="normal">Normal route</button>
      <button type="button" id="transition">Run transition</button>
      <button type="button" id="inscriptions">Inscription gallery</button>
      <button type="button" id="hazards">Security hazards</button>
      <button type="button" id="receipt">Miner confirmation</button>
      <button type="button" id="pause-check">Pause / resume</button>
    </div>
    <output id="qa-state" aria-live="polite">Loading the real game renderer…</output>
  </aside>
  <script type="module">
    // This fixture is a separate Vite development entry and is not part of dist/.
    // It uses the production renderer, simulation, UI and CSS without browser injection.
    import * as THREE from 'three';
    import sourceHtml from '/index.html?raw';
    import { World } from '/src/view/world.ts';
    import { createBitcoinCore } from '/src/view/models.ts';
    import { Sim } from '/src/sim/sim.ts';
    import { startLiveChain } from '/src/live-chain.ts';
    import { UI } from '/src/ui.ts';
    import { OB, trainLength } from '/src/config.ts';
    import { PACKET, KEY_EXPOSURE, RBF_WAR, QUANTUM_WATCH } from '/src/sim/obstacle-variants.ts';

    const sourceDocument = new DOMParser().parseFromString(sourceHtml, 'text/html');
    for (const original of sourceDocument.querySelectorAll('style')) {
      const style = document.createElement('style');
      style.textContent = original.textContent;
      document.head.append(style);
    }
    const fixtureStyle = document.createElement('style');
    fixtureStyle.textContent = `
      #qa-tools{position:fixed;z-index:100;left:10px;right:10px;bottom:8px;padding:10px 12px;background:#101616f2;border:1px solid #6c9f96;border-radius:4px;font:10px/1.5 monospace;color:#fff}
      #qa-tools strong{font-weight:400;color:#9ce9d8}
      .qa-actions{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0}
      #qa-tools button{background:#243f38;border:1px solid #74b09f;border-radius:3px;padding:5px 8px;font:inherit}
      #qa-state{display:block;color:#d0e9e3;font-variant-numeric:tabular-nums}
      .route-status{bottom:125px}
      #ui{pointer-events:none}.hud-left{pointer-events:auto}
      #synthetic-label{position:fixed;bottom:4px;left:8px;color:#c8c8c8;background:#111c;padding:3px 6px;font:10px monospace}
      body.block-preview .route-status{bottom:28px}
      @media(max-width:600px){.route-status{bottom:160px}#qa-tools{font-size:9px}}
    `;
    document.head.append(fixtureStyle);

    const canvas = document.getElementById('game');
    const status = document.getElementById('qa-state');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1,2));
    const world = new World(createBitcoinCore(),{shadowSize:1024});
    world.player.setCharacter('ifd');
    const sim = new Sim(12);
    let running = false;
    let phase = 'Full tunnel';
    const ui = new UI(document.getElementById('ui'),{
      play(){running=true;},resume(){running=true;},pause(){running=!running;},
      restart(){reset('transition');},home(){reset('full');},
      toggleMute(){},langChanged(){},selectCharacter(){}
    },true);
    ui.show('play');
    const resize = () => {
      renderer.setSize(innerWidth,innerHeight,false);
      world.resize(innerWidth,innerHeight);
    };
    addEventListener('resize',resize);
    resize();

    function reset(mode) {
      running = mode === 'transition';
      sim.noSpawn = true;
      sim.reset(12,false);
      sim.clearWorld();
      sim.speedOverride = 22;
      sim.start();
      sim.speed=22;
      world.resetScenery();
      ui.show('play');
      const obstacle = (kind,lane,d,cars=1,variant=0) => sim.addOb({
        kind,lane,d0:d,d1:d+(kind==='train'?trainLength(cars):OB[kind].depth),cars,variant
      });
      if(mode==='inscriptions') {
        phase='Inscription gallery';
        obstacle('train',0,8,1,PACKET.wizard);
        obstacle('train',1,11,1,PACKET.cat);
        obstacle('train',2,8,1,PACKET.punk);
        return;
      }
      if(mode==='hazards') {
        phase='Security hazards';
        obstacle('hurdle',0,7,1,RBF_WAR);
        obstacle('overhead',1,11,1,QUANTUM_WATCH);
        obstacle('low',2,7,1,KEY_EXPOSURE);
        return;
      }
      if(mode==='receipt') {
        // Follow an actual pickup through the full tunnel to its first payment.
        // No ordinary coins in this scene: the HUD shows the exact reward.
        phase='Miner confirmation';
        sim.addPower('slipstream',1,.5,1.1);
        obstacle('train',0,221,1,PACKET.wizard);
        obstacle('train',2,224,1,PACKET.punk);
        for(let frame=0;frame<120*12;frame++) {
          sim.update(1/120);
          const payment=sim.drainEvents().find(event=>event.type==='delivery');
          if(payment) { ui.confirmDelivery(payment.sats); return; }
        }
        throw new Error('The runner passed the miner without a delivery event');
      }
      // Different silhouettes remain in sight before, during and after expiry.
      obstacle('low',1,18);
      obstacle('train',0,28,3,2);
      obstacle('overhead',1,42);
      obstacle('ramp',2,45);
      obstacle('train',2,52,3,2);
      obstacle('hurdle',1,80);
      obstacle('low',1,112);
      obstacle('train',0,124,2,3);
      obstacle('overhead',2,138);
      for(let d=6;d<160;d+=4)sim.addCoin(1,d,.85);
      if(mode==='full') {sim.power.slipstream=9;phase='Full tunnel';}
      else if(mode==='warning'||mode==='transition') {sim.power.slipstream=3;phase=mode==='warning'?'3 seconds to exit':'Running transition';}
      else if(mode==='shield') {
        sim.power.slipstream=.001;
        sim.update(1/120); // Reach the real expiry path, including its safety timer.
        phase='Exit shield';
      } else {phase='Normal route';}
      sim.drainEvents();
    }
    for(const id of ['full','warning','shield','normal','transition','inscriptions','hazards','receipt'])document.getElementById(id).addEventListener('click',()=>reset(id));
    document.getElementById('pause-check').addEventListener('click',()=>{running=!running;});
    addEventListener('keydown',event=>{
      if(event.key==='ArrowLeft')sim.left();
      else if(event.key==='ArrowRight')sim.right();
      else if(event.key==='ArrowUp'||event.key===' ')sim.jump();
      else if(event.key==='ArrowDown')sim.down();
      else if(event.key.toLowerCase()==='p')running=!running;
      else return;
      event.preventDefault();
    });
    if (new URLSearchParams(location.search).has('block')) {
      // A local network fixture feeds two linked tips to the real poller.
      // The shipped page imports neither the mock response nor the test controls.
      document.getElementById('qa-tools').hidden = true;
      document.getElementById('synthetic-label').hidden = false;
      document.body.classList.add('block-preview');
      sim.reset(12, false);
      sim.start();
      let jumped = false, slid = false;
      while (sim.alive && sim.d < 69) {
        if (!jumped && sim.d >= 24.5) { sim.jump(); jumped = true; }
        if (!slid && sim.d >= 48) { sim.down(); slid = true; }
        sim.update(1/120);
      }
      if (!sim.alive) throw new Error('The runner missed the opening ramp');
      phase = 'Synthetic block baseline';
      let height = 900000;
      const hash = h => h.toString(16).padStart(64,'0');
      async function mockFetch(url) {
        if (new URL(url).pathname === '/api/mempool') return Response.json({count:34722,vsize:16000000});
        if (new URL(url).pathname !== '/api/blocks') throw new Error('Unexpected fixture endpoint: ' + url);
        const h = height++;
        return Response.json([{height:h,id:hash(h),previousblockhash:hash(h-1)}]);
      }
      const stop = startLiveChain(feed => {
        ui.setChain(feed);
        world.setMempoolSize(feed.status === 'live' ? feed.vsize : null);
        running = feed.status === 'live';
      }, tip => {
        if (!sim.startBlockBonus(tip.height)) throw new Error('Block bonus did not start');
        ui.setBlockBonus(sim.blockBonusSeconds, tip.height);
        running = false;
        phase = 'Synthetic successor block ' + tip.height;
        stop();
      }, mockFetch, 500);
      window.addEventListener('pagehide', stop, {once:true});
    } else {
      reset('full');
    }
    let previous=performance.now();
    function frame(now) {
      const dt=Math.min(.05,(now-previous)/1000);previous=now;
      if(running)sim.update(dt);
      const events=sim.drainEvents();
      for(const event of events) {
        world.event(event);
        if(event.type==='delivery')ui.confirmDelivery(event.sats);
      }
      world.player.update(sim,dt,events);
      world.sync(sim,dt,false);
      ui.hud(Math.floor(sim.score),sim.coins,sim.mult,sim.power);
      ui.setBlockBonus(sim.blockBonusSeconds);
      ui.status(sim.d,sim.power.slipstream,sim.slipstreamExitGrace);
      const description=`${phase} · ${running?'running':'paused'} · tunnel ${sim.power.slipstream.toFixed(2)} s · exit shield ${(sim.slipstreamExitGrace||0).toFixed(2)} s · ${sim.alive?'alive':'collision'} · ${sim.d.toFixed(1)} m`;
      status.textContent=description;
      canvas.setAttribute('aria-label',description);
      renderer.render(world.scene,world.camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
